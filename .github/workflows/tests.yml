name: Tests

on:
  push:
  pull_request:

jobs:
  synthetic-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Pipeline regression tests
        run: python3 scripts/test_srt_pipeline.py
      - name: Quality regression tests
        run: python3 -m unittest discover -s scripts -p 'test_quality_upgrade.py' -v
